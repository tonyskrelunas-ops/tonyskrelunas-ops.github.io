<!doctype html><meta charset="utf-8"><title>capture test</title>
<body style="background:#0B1422;color:#7CE38B;font:14px ui-monospace,monospace;padding:24px">
<div id="o">running…</div>
<script>
var out=[];
function say(t){out.push(t);document.getElementById("o").innerHTML=out.join("<br>")}
// 1. can this browser reach the open internet at all?
fetch("https://api.github.com/zen").then(r=>r.text()).then(t=>say("NET OK: "+t.slice(0,40)))
  .catch(e=>say("NET FAIL: "+e));
// 2. the real call, with the error surfaced
var b=new FormData();
b.append("access_key","057975c1-1a1a-465e-9b5e-3fb6692b2106");
b.append("email","setup-test@tribeawaken.com");
b.append("subject","TribeAwaken — email capture is WORKING");
b.append("from_name","TribeAwaken website");
b.append("message","One-time test from tribeawaken.com.");
setTimeout(function(){
 fetch("https://api.web3forms.com/submit",{method:"POST",body:b})
  .then(function(r){say("HTTP "+r.status);return r.text()})
  .then(function(t){say("BODY "+t.slice(0,200))})
  .catch(function(e){say("W3 FAIL: "+e.message)});
},1200);
// 3. JSON variant
setTimeout(function(){
 fetch("https://api.web3forms.com/submit",{method:"POST",
   headers:{"Content-Type":"application/json",Accept:"application/json"},
   body:JSON.stringify({access_key:"057975c1-1a1a-465e-9b5e-3fb6692b2106",
     subject:"TribeAwaken capture test (json)",from_name:"TribeAwaken",
     email:"setup-test@tribeawaken.com",message:"json variant"})})
  .then(r=>r.json()).then(r=>say("JSON RESULT "+JSON.stringify(r)))
  .catch(e=>say("JSON FAIL: "+e.message));
},2600);
</script></body>

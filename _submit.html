<!doctype html><meta charset="utf-8">
<body style="background:#0B1422;color:#7CE38B;font:15px monospace;padding:24px">
<div id=o>submitting…</div>
<iframe id="f" name="f" style="width:1px;height:1px;opacity:0"></iframe>
<form id="real" action="https://api.web3forms.com/submit" method="POST" target="f">
  <input type="hidden" name="access_key" value="057975c1-1a1a-465e-9b5e-3fb6692b2106">
  <input type="hidden" name="subject" value="TribeAwaken — capture test, it works">
  <input type="hidden" name="from_name" value="TribeAwaken">
  <input type="hidden" name="email" value="setup-test@tribeawaken.com">
  <input type="hidden" name="message" value="Live form test from tribeawaken.com. If this reached you, email capture is working.">
  <input type="hidden" name="redirect" value="https://tribeawaken.com/thanks/">
</form>
<script>
var t=0;
document.getElementById('real').submit();
var iv=setInterval(function(){
  t++;
  var u='(cross-origin)';
  try{ u=document.getElementById('f').contentWindow.location.href }catch(e){}
  if(u.indexOf('/thanks/')>-1){
    document.getElementById('o').innerHTML='<b style="color:#7CE38B;font-size:24px">SUCCESS — Web3Forms accepted it and redirected to /thanks/</b>';
    clearInterval(iv);
  } else if(t>14){
    document.getElementById('o').innerHTML='<b style="color:#E5895C">NO REDIRECT after 14s. Frame at: '+u+'</b>';
    clearInterval(iv);
  } else {
    document.getElementById('o').textContent='waiting… '+t+'s   frame: '+u;
  }
},1000);
</script></body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TribeAwaken — Symbol Contact Sheet</title>
<style>
  :root {
    --canyon: #1B1210;
    --ember: #E5895C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 32px 64px;
    background: var(--canyon);
    color: var(--ember);
    font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 1120px; margin: 0 auto 36px; }
  h1 {
    font-size: 24px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; margin: 0 0 8px;
  }
  header p {
    margin: 0; font-size: 13px; letter-spacing: .05em;
    color: rgba(229,137,92,.62);
  }
  section { max-width: 1120px; margin: 0 auto 44px; }
  h2 {
    font-size: 12px; font-weight: 500; letter-spacing: .22em;
    text-transform: uppercase; color: rgba(229,137,92,.55);
    margin: 0 0 18px; padding-bottom: 9px;
    border-bottom: 1px solid rgba(229,137,92,.18);
  }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px;
  }
  .tile { margin: 0; text-align: center; }
  .frame {
    position: relative;
    aspect-ratio: 1 / 1;
    border: 1px solid rgba(229,137,92,.16);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    padding: 10px;
  }
  .frame svg { width: 100%; height: 100%; display: block; }
  .small {
    height: 34px; margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
  }
  .small svg { height: 32px; width: 32px; }
  .small svg:last-child { height: 20px; width: 20px; opacity: .9; }
  figcaption {
    margin-top: 8px; font-size: 11px; letter-spacing: .06em;
    color: rgba(229,137,92,.6);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<header>
  <h1>TribeAwaken · Symbol Set</h1>
  <p>Diné · Lithuanian · Japanese — three peoples, one human operating system.
     Each mark is a 200×200 SVG drawn in <code>currentColor</code>.</p>
</header>
    <section>

    </section>
<script>
(async () => {
  const nodes = [...document.querySelectorAll('[data-src]')];
  const uniq = [...new Set(nodes.map(n => n.dataset.src))];
  const cache = {};
  await Promise.all(uniq.map(async src => {
    try { cache[src] = await (await fetch(src)).text(); }
    catch (e) { cache[src] = ''; }
  }));
  for (const n of nodes) {
    const markup = cache[n.dataset.src] || '';
    n.innerHTML = n.classList.contains('small') ? markup + markup : markup;
  }
})();
</script>

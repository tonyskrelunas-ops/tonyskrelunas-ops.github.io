<!doctype html>
<!-- TEMPORARY harness for checking form states. Delete before shipping. -->
<html lang="en"><head><meta charset="utf-8"><title>form state test</title>
<style>html,body{margin:0;background:#1B1210}iframe{width:1200px;height:1150px;border:0;display:block}</style>
</head><body>
<iframe id="f" src=""></iframe>
<script>
var p = new URLSearchParams(location.search);
var page = p.get('page') || 'circle';
var mode = p.get('case') || 'empty';
var f = document.getElementById('f');
f.src = '/v2/' + page + '/' + (mode === 'sent' ? '?sent=1' : '') + '#' + (page === 'circle' ? 'fire' : 'ask');
f.onload = function () {
  var d = f.contentDocument, w = f.contentWindow;
  var form = d.querySelector('form[data-mail-form]');
  setTimeout(function () {
    if (mode === 'empty') {
      form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    } else if (mode === 'filled') {
      d.querySelectorAll('input[type=text],input[type=email],textarea').forEach(function (el) {
        el.value = el.type === 'email' ? 'reader@example.com' : 'Sample text typed by a reader who found the page and had something to say.';
      });
      var sel = d.querySelector('select'); if (sel) sel.selectedIndex = 2;
      form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    } else if (mode === 'badmail') {
      var em = d.querySelector('input[type=email]'); em.value = 'not-an-address';
      var tx = d.querySelector('textarea'); if (tx) tx.value = 'Something worth saying.';
      form.dispatchEvent(new w.Event('submit', { cancelable: true, bubbles: true }));
    }
    setTimeout(function(){
      var t = d.querySelector('.f-shell'); if (t) t.scrollIntoView({block:'center'});
    }, 120);
  }, 400);
};
</script>
</body></html>

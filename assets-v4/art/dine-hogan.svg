<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Six-sided cribbed-log hogan with an east-facing door">
  <!-- ground -->
  <line x1="12" y1="170" x2="188" y2="170"/>

  <!-- six-sided wall: straight faceted sides, flat top plate -->
  <path d="M 26,170 L 26,124 L 52,106 L 148,106 L 174,124 L 174,170"/>
  <line x1="52" y1="106" x2="52" y2="170" opacity="0.4"/>
  <line x1="148" y1="106" x2="148" y2="170" opacity="0.4"/>

  <!-- cribbed log courses -->
  <line x1="26" y1="140" x2="174" y2="140" opacity="0.35"/>
  <line x1="26" y1="155" x2="174" y2="155" opacity="0.35"/>

  <!-- low faceted roof: straight planes meeting a flat smoke opening -->
  <path d="M 26,124 L 78,80 L 122,80 L 174,124"/>
  <path d="M 52,106 L 88,80" opacity="0.45"/>
  <path d="M 148,106 L 112,80" opacity="0.45"/>

  <!-- the smoke hole is a squared opening in the roof plane -->
  <path d="M 82,80 L 82,72 L 118,72 L 118,80"/>
  <line x1="82" y1="72" x2="118" y2="72"/>

  <!-- smoke, drifting off-centre so it never reads as a point -->
  <path d="M 92,66 C 84,54 98,48 90,34" opacity="0.55"/>
  <path d="M 108,66 C 102,56 114,50 109,38" opacity="0.35"/>

  <!-- the door always faces east -->
  <path d="M 106,170 L 106,132 L 136,132 L 136,170"/>
  <line x1="106" y1="140" x2="136" y2="140" opacity="0.45"/>
  <line x1="112" y1="153" x2="112" y2="159" opacity="0.6"/>

  <!-- the sun it faces -->
  <circle cx="168" cy="44" r="7" opacity="0.9"/>
  <line x1="178.5" y1="44" x2="183.5" y2="44" opacity="0.7"/>
  <line x1="175.4" y1="36.6" x2="179" y2="33" opacity="0.7"/>
  <line x1="168" y1="33.5" x2="168" y2="28.5" opacity="0.7"/>
  <line x1="160.6" y1="36.6" x2="157" y2="33" opacity="0.7"/>
  <line x1="157.5" y1="44" x2="152.5" y2="44" opacity="0.7"/>
  <line x1="160.6" y1="51.4" x2="157" y2="55" opacity="0.7"/>
  <line x1="168" y1="54.5" x2="168" y2="59.5" opacity="0.7"/>
  <line x1="175.4" y1="51.4" x2="179" y2="55" opacity="0.7"/>
</svg>

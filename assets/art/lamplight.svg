<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A kerosene lamp, lit">
  <!-- the light it throws -->
  <line x1="100" y1="18" x2="100" y2="4" opacity="0.5"/>
  <line x1="132" y1="27" x2="139" y2="14" opacity="0.42"/>
  <line x1="68" y1="27" x2="61" y2="14" opacity="0.42"/>
  <line x1="156" y1="52" x2="169" y2="44" opacity="0.34"/>
  <line x1="44" y1="52" x2="31" y2="44" opacity="0.34"/>
  <line x1="166" y1="86" x2="181" y2="83" opacity="0.26"/>
  <line x1="34" y1="86" x2="19" y2="83" opacity="0.26"/>

  <!-- the handle -->
  <path d="M 86,40 C 74,34 66,40 66,50" opacity="0.7"/>
  <path d="M 114,40 C 126,34 134,40 134,50" opacity="0.7"/>

  <!-- the chimney: glass, waisted -->
  <path d="M 79,44 L 79,62 C 79,74 70,80 70,94 C 70,108 78,114 80,124"/>
  <path d="M 121,44 L 121,62 C 121,74 130,80 130,94 C 130,108 122,114 120,124"/>
  <line x1="79" y1="44" x2="121" y2="44"/>

  <!-- the flame -->
  <path d="M 100,74 C 92,88 95,98 100,104 C 105,98 108,88 100,74 Z"/>
  <path d="M 100,86 C 97,94 98,99 100,102 C 102,99 103,94 100,86 Z" opacity="0.6"/>

  <!-- the burner collar and wick knob -->
  <path d="M 76,124 L 124,124 L 124,133 L 76,133 Z"/>
  <line x1="84" y1="124" x2="84" y2="133" opacity="0.5"/>
  <line x1="100" y1="124" x2="100" y2="133" opacity="0.5"/>
  <line x1="116" y1="124" x2="116" y2="133" opacity="0.5"/>
  <circle cx="133" cy="129" r="4.5" opacity="0.8"/>
  <line x1="137.5" y1="129" x2="142" y2="129" opacity="0.6"/>

  <!-- the reservoir -->
  <path d="M 82,133 C 70,140 64,150 64,160 C 64,170 74,176 100,176 C 126,176 136,170 136,160 C 136,150 130,140 118,133"/>
  <path d="M 72,159 C 82,163 118,163 128,159" opacity="0.45"/>

  <!-- the table it sits on -->
  <line x1="24" y1="184" x2="176" y2="184" opacity="0.6"/>
  <line x1="40" y1="189" x2="160" y2="189" opacity="0.35"/>
</svg>

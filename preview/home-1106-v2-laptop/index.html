<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home page, laptop view</title>
<style>
  html,body{margin:0;height:100%;background:#1d2420;overflow:hidden}
  #wrap{position:fixed;inset:0;overflow:hidden}
  iframe{position:absolute;top:0;left:0;border:0;width:1440px;transform-origin:0 0;background:#fff}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="/preview/home-1106-v2/?laptop=1" title="TribeAwaken home page at laptop size" allow="autoplay"></iframe></div>
<script>
  /* the real page at 1440 wide (a laptop), scaled down to fit this screen; scroll inside it as usual */
  const f = document.getElementById('f');
  function fit(){ const s = innerWidth / 1440; f.style.transform = 'scale(' + s + ')'; f.style.height = Math.ceil(innerHeight / s) + 'px'; }
  fit(); addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 300));
</script>
</body>
</html>
